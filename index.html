        const colors = ['red', 'blue', 'green', 'yellow'];

        let turn = 0;
        let playerHand = [];
        let b1Cards = 7;
        let b2Cards = 7;
        let topCard = { color: 'red', value: '7' };

        function getRandomCard() {
            if (Math.random() < 0.08) return { color: 'wild', value: '🌈' };
            return {
                color: colors[Math.floor(Math.random() * colors.length)],
                value: values[Math.floor(Math.random() * values.length)]
            };
        }

        function render() {
            const handEl = document.getElementById('player-hand');
            if (handEl) {
                handEl.innerHTML = '';
                playerHand.forEach((card, i) => {
                    const c = document.createElement('div');
                    c.className = card-slot ${card.color};
                    c.innerText = card.value;
                    c.onclick = () => playCard(i);
                    handEl.appendChild(c);
                });
            }

            const discard = document.getElementById('discard-pile');
            if (discard) {
                discard.className = card-slot ${topCard.color};
                discard.innerText = topCard.value;
            }

            const b1 = document.getElementById('b1-tag');
            const b2 = document.getElementById('b2-tag');
            if (b1) b1.innerText = 🤖 Бот 1: ${b1Cards};
            if (b2) b2.innerText = 🤖 Бот 2: ${b2Cards};

            if (b1) b1.classList.toggle('active', turn === 1);
            if (b2) b2.classList.toggle('active', turn === 2);

            const st = document.getElementById('status-label');
            if (st) {
                if (turn === 0) {
                    st.innerText = 'Твой ход';
                    st.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                } else {
                    st.innerText = 'Ход бота...';
                    st.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
                }
            }
        }

        function playCard(idx) {
            if (turn !== 0) return;
            const card = playerHand[idx];

            if (card.color === topCard.color  card.value === topCard.value  card.color === 'wild') {
                playerHand.splice(idx, 1);
                if (card.color === 'wild') {
                    document.getElementById('color-picker').style.display = 'flex';
                } else {
                    topCard = card;
                    nextTurn();
                }
                render();
            }
        }

        function selectColor(col) {
            topCard = { color: col, value: '🌈' };

        }

            if (turn !== 0) return;

        function nextTurn() {

        }

            if (turn === 1) {
                if (Math.random() > 0.4) b1Cards = Math.max(1, b1Cards - 1);
                else b1Cards++;

            }

            nextTurn();
        }
